# Render blueprint: New → Blueprint, point it at this repository, and the
# service below is created as described. One setting cannot be declared here,
# and is prompted for instead - see OPENAI_API_KEY.
#
# A free instance has no persistent disk and loses filesystem changes whenever
# it sleeps, so records are kept by copying them to a PRIVATE repository -
# CIRA_RECORD_REPO below. Remove those two variables and nothing is kept
# beyond the download in the interface, which is a reasonable choice for a
# demo but should be a deliberate one.

services:
  - type: web
    name: cira
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # The service answers this before Render routes traffic to it, so a failed
    # build or a crashed process shows up as a failed deploy rather than as a
    # blank page.
    healthCheckPath: /api/health

    envVars:
      # sync: false means Render prompts for the value and stores it as a
      # secret. Neither of these may be committed; if either ever is, revoke
      # and reissue it.
      - key: OPENAI_API_KEY
        sync: false

      # A token with Contents: read and write on the repository below.
      - key: CIRA_RECORD_TOKEN
        sync: false

      # Where each intake record is kept. This MUST be a private repository -
      # a public one publishes every intake. Change it to your own.
      - key: CIRA_RECORD_REPO
        value: AmirGadami/cira-records
